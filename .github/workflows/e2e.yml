name: E2E

# Пока выключен: только ручной запуск. Включим триггеры, когда появятся сценарии в tests/e2e.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/crm_e2e
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/crm_e2e
      PW_SKIP_BUILD: '1'
      # next start идёт с NODE_ENV=production: без APP_ORIGIN мутации получают 403 (D-153), без
      # CRM_PROXY_SECRET приложение не стартует (D-155). Секрет — синтетика только для e2e.
      APP_ORIGIN: http://localhost:3100
      CRM_PROXY_SECRET: e2e-proxy-secret-synthetic-not-for-production
      # Ключи HMAC номеров и ИИН: без них итог звонка в production-сборке отвечает 500. Синтетика только для e2e.
      CRM_PHONE_HMAC_KEY: e2e-phone-hmac-key-synthetic-not-for-production
      CRM_IIN_HMAC_KEY: e2e-iin-hmac-key-synthetic-not-for-production
      # БД, которую готовят сценарии (tests/e2e/support/prepare-db.ts): та же, что у сервера
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/crm_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Миграции
        run: npm run db:migrate
      - name: Сборка
        run: npx next build --webpack
      - name: Браузеры Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: E2E
        run: npm run test:e2e
      # Доска оператора и новый «Перезвон» за флагами (на стенде включены, в бою выключены): основной прогон выше идёт
      # с выключенными флагами и держит прежнее поведение, этот — сценарии доски с включёнными: оператор (calling-board*),
      # РОП и директор (booking-mgr-board), сквозной путь на телефонах и ноутбуке (flow-board-*). Новые спеки доски
      # называй с префиксом calling-board или flow-board, иначе фильтр их не подхватит
      - name: E2E с OP_BOARD и CALLBACK_V2
        run: npx playwright test calling-board calling-callback shell-menu booking-mgr-board flow-board
        env:
          FEATURE_OP_BOARD: '1'
          FEATURE_CALLBACK_V2: '1'
      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
