name: E2E

# Пока выключен: только ручной запуск. Включим триггеры, когда появятся сценарии в tests/e2e.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/crm_e2e
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/crm_e2e
      PW_SKIP_BUILD: '1'
      # next start идёт с NODE_ENV=production: без APP_ORIGIN мутации получают 403 (D-153), без
      # CRM_PROXY_SECRET приложение не стартует (D-155). Секрет — синтетика только для e2e.
      APP_ORIGIN: http://localhost:3100
      CRM_PROXY_SECRET: e2e-proxy-secret-synthetic-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Миграции
        run: npm run db:migrate
      - name: Сборка
        run: npx next build --webpack
      - name: Браузеры Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: E2E
        run: npm run test:e2e
      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
